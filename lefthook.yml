glob_matcher: doublestar

pre-commit:
  jobs:
    - name: csharp-format
      glob: "**/*.{cs,csx,csproj,props,targets,slnx,xml,config,resx}"
      run: csharpier format {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: "**/*.{md,json,jsonc,yml,yaml,toml,js,mjs,ts}"
      run: bunx --bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "**/*.md"
      run: bunx --bun markdownlint-cli2 --no-globs --fix {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: check
      run: mise run check
