name: Build and release

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # Skipped job -> passed
  # Skipped workflow -> leaves required checks pending
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request || ( "$EVENT" == push && "$REF_TYPE" == branch ) ]] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(README\.md|AGENTS\.md|docs/|LICENSE$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: "mise run hooks:check ::: fmt:check ::: docs:build ::: notices:check ::: build"

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      CONFIGURATION: Release
      # Tasks are written for Bash. Git Bash is preinstalled on Windows runners.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: dotnet
      - run: mise run test
      - name: Install Roslyn for integration tests
        run: mise run ci:roslyn
      - run: mise run test-integration
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hang-dumps-${{ matrix.os }}
          path: TestResults/*.dmp
          if-no-files-found: ignore

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: dotnet
      - name: Set package version
        run: mise run ci:version
      - run: mise run pack
      - name: Start the packed tool
        run: |
          dotnet tool install ThomasFazzari.RoslynBridge --tool-path "$RUNNER_TEMP/tool" --add-source artifacts/nupkg --version "$APP_VERSION"
          "$RUNNER_TEMP/tool/roslyn-bridge-mcp" --help
      # Only the tag jobs download it
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: nupkg
          path: artifacts/nupkg/*
          if-no-files-found: error
          compression-level: 0

  # The only check the master ruleset requires
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, formatting, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJson(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [formatting, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nupkg
          path: artifacts/nupkg
      - name: Publish the release with the tool package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run ci:release

  nuget:
    name: Publish NuGet package
    if: github.ref_type == 'tag'
    needs: [formatting, test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: dotnet
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nupkg
          path: artifacts/nupkg
      - name: Get NuGet API key
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push the package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: mise run ci:nuget
