name: Build and release

on:
  push:
    branches:
      [
        master,
        feat/**,
        fix/**,
        test/**,
        style/**,
        docs/**,
        build/**,
        ops/**,
        chore/**,
        perf/**,
        refactor/**,
      ]
    tags: [v*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # Skipped job -> passed
  # Skipped workflow -> leaves required checks pending
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [[ "$EVENT" == pull_request || ( "$EVENT" == push && "$REF_TYPE" == branch ) ]] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^(README\.md|AGENTS\.md|docs/|LICENSE$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run install
      - run: "mise run hooks:check ::: dotnet:fmt ::: tooling:fmt ::: docs:check ::: notices:check ::: build"

  native:
    name: Native AOT (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit tests run on the managed runtime, so one runner per operating system is enough
          - os: ubuntu-latest
            rid: linux-x64
            executable: RoslynBridge
            unit-tests: true
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            executable: RoslynBridge
          - os: macos-26-intel
            rid: osx-x64
            executable: RoslynBridge
          - os: macos-latest
            rid: osx-arm64
            executable: RoslynBridge
            unit-tests: true
          - os: windows-latest
            rid: win-x64
            executable: RoslynBridge.exe
            unit-tests: true
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ID: ${{ matrix.rid }}
      EXECUTABLE: ${{ matrix.executable }}
      CONFIGURATION: Release
      # Tasks are written for Bash. Git Bash is preinstalled on Windows runners.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -c
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: dotnet
      - name: Install native build tools
        run: mise run ci:setup
      - name: Set binary version
        run: mise run ci:version
      - name: Run unit tests
        if: matrix.unit-tests
        run: mise run test
      - name: Publish native executable
        run: mise run publish
      - name: Install Roslyn for integration tests
        run: mise run ci:roslyn
      - name: Test native executable against Roslyn
        env:
          ROSLYN_BRIDGE_TEST_EXECUTABLE: ${{ github.workspace }}/artifacts/native/${{ matrix.executable }}
        run: mise run test-integration
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hang-dumps-${{ matrix.rid }}
          path: TestResults/*.dmp
          if-no-files-found: ignore
      - name: Package native executable
        run: mise run ci:package
      # Only the tag jobs download them
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
      - name: Pack .NET tool package
        run: mise run pack
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: nupkg-${{ matrix.rid }}
          path: artifacts/nupkg/*
          if-no-files-found: error
          compression-level: 0

  # The only check the master ruleset requires
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, formatting, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          NEEDS: ${{ toJson(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [formatting, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested executables and notices
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: mise run ci:release

  nuget:
    name: Publish NuGet packages
    if: github.ref_type == 'tag'
    needs: [formatting, native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.1.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: dotnet
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: nupkg-*
          path: artifacts/nupkg
          merge-multiple: true
      - name: Set package version
        run: mise run ci:version
      - name: Pack .NET tool package
        run: mise run pack
      - name: Get NuGet API key
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: mise run ci:nuget
