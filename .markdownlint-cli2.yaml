config:
  extends: ./node_modules/markdownlint/style/prettier.json
  MD024:
    siblings_only: true
  MD033:
    allowed_elements: [Aside]
globs:
  - README.md
  - AGENTS.md
  - CONTRIBUTING.md
  - "docs/**/*.mdx"
ignores:
  - "**/node_modules/**"
  - "docs/.astro/**"
  - "docs/dist/**"
  - NOTICE
  - LICENSE
fix: false
