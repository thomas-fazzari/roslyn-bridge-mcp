min_version = "2026.9.0"

[settings]
idiomatic_version_file_enable_tools = ["dotnet"]

[tools]
"dotnet:csharpier" = "1.4.0"
bun = "1.4.4"
hk = "2.12.0"
"aqua:oxc-project/oxc/oxfmt" = "0.78.0"
rumdl = "0.3.3"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"aqua:skaji/relocatable-perl" = { version = "5.44.0.0", os = ["linux", "macos"] }

[task_config]
includes = ["eng/tasks"]

[tasks.install]
description = "Restores the .NET and documentation dependencies"
run = ["dotnet restore RoslynBridge.slnx", "bun install --cwd docs --frozen-lockfile"]

[tasks.build]
description = "Builds the solution with analyzers (CONFIGURATION defaults to Debug)"
run = 'dotnet build RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}"'

[tasks.test]
description = "Runs the unit tests, with extra arguments passed to dotnet test"
depends = ["build"]
run = 'dotnet test --solution RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}" --no-build --no-restore -- --explicit off'

[tasks.test-integration]
description = "Runs the explicit tests against the real Roslyn server"
depends = ["build"]
run = 'dotnet test --solution RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}" --no-build --no-restore -- --explicit only --filter-class RoslynBridge.Tests.Integration.Roslyn.RoslynMcpTests'

[tasks.check]
description = "Runs every formatting, analyzer, documentation, license notice and unit test check"
run = [{ tasks = ["hooks:check", "fmt:check", "docs:build", "notices:check"] }, { task = "test" }]

[tasks.fix]
description = "Formats every file and fixes lint through the steps of hk.pkl"
run = "hk fix --all"

[tasks.pack]
description = "Packs the .NET tool package into artifacts/nupkg (APP_VERSION is optional)"
run = 'dotnet pack src/RoslynBridge/RoslynBridge.csproj --configuration Release -p:Version="${APP_VERSION:-0.0.0-dev}" --output artifacts/nupkg'

[tasks."hooks:install"]
description = "Installs the Git hooks"
run = "hk install --mise"

[tasks."hooks:check"]
description = "Validates the Git hook configuration"
run = "hk validate"

[tasks."fmt:check"]
description = "Checks the formatting and lint of every file through the steps of hk.pkl"
run = "hk check --all"

[tasks."docs:dev"]
description = "Serves the documentation with live updates"
dir = "docs"
run = "bunx --bun astro dev --host 127.0.0.1 --port 5174"

[tasks."docs:build"]
description = "Builds the documentation site"
dir = "docs"
run = "bunx --bun astro build"

[tasks."docs:check"]
description = "Lints Markdown, checks its formatting and builds the documentation"
depends = ["docs:build"]
run = ["rumdl check .", 'oxfmt --check "docs/**/*.mjs"']

[tasks."notices:check"]
description = "Checks that THIRD_PARTY_NOTICES.md lists the packages the tool package ships"
run = "perl eng/tasks/check-notices.pl"
