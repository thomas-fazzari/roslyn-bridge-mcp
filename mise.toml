min_version = "2026.9.0"

[tools]
dotnet = "10.0.400"
"dotnet:csharpier" = "1.3.0"
bun = "1.4.2"
lefthook = "2.2.1"
perl = { version = "latest", os = ["linux", "macos"] }

[task_config]
includes = ["eng/tasks"]

[tasks.install]
description = "Restores the .NET and Bun dependencies"
run = ["dotnet restore RoslynBridge.slnx", "bun install --frozen-lockfile"]

[tasks.build]
description = "Builds the solution with analyzers (CONFIGURATION defaults to Debug)"
run = 'dotnet build RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}"'

[tasks.test]
description = "Runs the unit tests, with extra arguments passed to dotnet test"
depends = ["build"]
run = 'dotnet test --solution RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}" --no-build --no-restore -- --explicit off'

[tasks.test-integration]
description = "Runs the explicit tests against the real Roslyn server"
depends = ["build"]
run = 'dotnet test --solution RoslynBridge.slnx --configuration "${CONFIGURATION:-Debug}" --no-build --no-restore -- --explicit only --filter-class RoslynBridge.Tests.Integration.Roslyn.RoslynMcpTests'

[tasks.check]
description = "Runs every formatting, analyzer, documentation, license notice and unit test check"
run = [
  { tasks = [
    "hooks:check",
    "dotnet:fmt",
    "tooling:fmt",
    "docs:check",
    "notices:check",
  ] },
  { task = "test" },
]

[tasks.fix]
description = "Formats C#, MSBuild, Markdown, JSON, YAML and TOML files"
run = ["csharpier format .", "bunx --bun oxfmt --write ."]

[tasks.publish]
description = "Publishes the native bridge for RUNTIME_ID (APP_VERSION and NATIVE_OUTPUT are optional)"
run = """
test -n "${RUNTIME_ID:-}" || { echo 'Set RUNTIME_ID, for example osx-arm64.' >&2; exit 1; }
dotnet publish src/RoslynBridge/RoslynBridge.csproj --configuration Release --runtime "$RUNTIME_ID" -p:Version="${APP_VERSION:-0.0.0-dev}" --output "${NATIVE_OUTPUT:-artifacts/native}"
"""

[tasks.pack]
description = "Packs the .NET tool package for RUNTIME_ID, or the tool package that points to them when unset (APP_VERSION and PACKAGE_OUTPUT are optional)"
run = """
dotnet pack src/RoslynBridge/RoslynBridge.csproj --configuration Release ${RUNTIME_ID:+--runtime "$RUNTIME_ID"} -p:Version="${APP_VERSION:-0.0.0-dev}" --output "${PACKAGE_OUTPUT:-artifacts/nupkg}"
"""

[tasks."hooks:install"]
description = "Installs the Git hooks"
run = "lefthook install"

[tasks."hooks:check"]
description = "Validates the Git hook configuration"
run = "lefthook validate"

[tasks."dotnet:fmt"]
description = "Checks C# and MSBuild formatting"
run = "csharpier check ."

[tasks."tooling:fmt"]
description = "Checks Markdown, JSON, YAML and TOML formatting"
run = "bunx --bun oxfmt --check ."

[tasks."docs:dev"]
description = "Serves the documentation with live updates"
run = "bunx --bun astro dev --root docs --host 127.0.0.1 --port 5174"

[tasks."docs:build"]
description = "Builds the documentation site"
run = "bunx --bun astro build --root docs"

[tasks."docs:check"]
description = "Lints Markdown, checks its formatting and builds the documentation"
depends = ["docs:build"]
run = [
  "bunx --bun markdownlint-cli2",
  'bunx --bun oxfmt --check README.md AGENTS.md CONTRIBUTING.md "docs/**/*.{mdx,mjs}"',
]

[tasks."notices:check"]
description = "Checks that THIRD_PARTY_NOTICES.md lists the packages the executable ships"
run = "perl eng/tasks/check-notices.pl"
